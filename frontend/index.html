<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zerodha AI Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--dk:0;--ink:#16241e;--mut:#5d6f67;--line:rgba(22,36,30,.1);--card:rgba(255,255,255,.72);--cardb:rgba(255,255,255,.85);--bg:#e3ece8;--acc:#2f8f6b;--accb:rgba(47,143,107,.14);--up:#12844f;--dn:#cf4339;--am:#c07a00;--amb:rgba(224,138,0,.16);--c1:#2f8f6b;--c2:#4a7fd1;--c3:#e6a23c;--c4:#8e6bd1;--c5:#d9576c;--c6:#3fb0c4;--m1:#b5e0cb;--m2:#b7cdf2;--m3:#dccbf0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--dk:1;--ink:#e6f0ea;--mut:#92a89d;--line:rgba(255,255,255,.1);--card:rgba(18,34,29,.72);--cardb:rgba(24,44,38,.9);--bg:#08130f;--accb:rgba(63,176,130,.18);--amb:rgba(224,138,0,.2);--m1:#0f3a2c;--m2:#102a4a;--m3:#2a1a47}}
:root[data-theme="dark"]{--dk:1;--ink:#e6f0ea;--mut:#92a89d;--line:rgba(255,255,255,.1);--card:rgba(18,34,29,.72);--cardb:rgba(24,44,38,.9);--bg:#08130f;--accb:rgba(63,176,130,.18);--amb:rgba(224,138,0,.2);--m1:#0f3a2c;--m2:#102a4a;--m3:#2a1a47}
*{box-sizing:border-box}html,body{margin:0}
body{color:var(--ink);font:14px/1.5 "DM Sans","Segoe UI",system-ui,sans-serif;background:radial-gradient(900px 520px at 5% 0,var(--m1),transparent 62%),radial-gradient(800px 520px at 100% 8%,var(--m2),transparent 60%),radial-gradient(800px 560px at 55% 105%,var(--m3),transparent 60%),var(--bg);background-attachment:fixed}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,#0f3a2e,#12303f);color:#dbe9e2;padding:22px 14px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;font:800 18px Manrope,sans-serif;letter-spacing:-.5px;padding:0 10px 30px;color:#fff}.brand i{font:700 18px Georgia;background:linear-gradient(135deg,#5fc79d,#3a9a78);width:28px;height:28px;border-radius:9px;display:grid;place-items:center;transform:rotate(-4deg);font-style:normal}.brand b{color:#7fd8b0}
.wl{font-size:10px;letter-spacing:1.2px;color:#8fb3a3;padding:0 12px 8px;font-weight:700}
nav{display:grid;gap:3px}nav button{display:flex;gap:11px;align-items:center;height:40px;border:0;background:none;color:#b9d0c5;font:500 13px inherit;font-family:inherit;padding:0 12px;border-radius:9px;cursor:pointer;text-align:left}
nav button:hover{background:rgba(255,255,255,.07)}nav button.on{background:rgba(255,255,255,.15);color:#fff;font-weight:600}nav button em{width:20px;text-align:center;font-style:normal}
.bot{margin-top:auto}.ana{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.08);border-radius:10px;padding:11px;margin-bottom:12px;position:relative}.ana small,.prof small{display:block;color:#8fb3a3;font-size:11px}.ana u{position:absolute;right:12px;top:14px;width:7px;height:7px;border-radius:50%;background:#4ee19a}
.prof{display:flex;gap:10px;align-items:center;padding:6px 4px}.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#6fd0a8,#4a7fd1);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}.av.sm{width:32px;height:32px}
.ma{min-width:0}.top{display:flex;justify-content:space-between;align-items:center;padding:14px 32px;border-bottom:1px solid var(--line);backdrop-filter:blur(8px);background:var(--card);position:sticky;top:0;z-index:4}
.bc{color:var(--mut)}.bc b{color:var(--ink)}.ta{display:flex;gap:10px;align-items:center}
.srch{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--cardb);color:var(--mut);border-radius:9px;padding:7px 12px;font:inherit;cursor:pointer;min-width:200px}.srch kbd{margin-left:auto;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px}
.ib{position:relative;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--cardb);color:var(--ink);cursor:pointer}.ib i{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--dn)}
.content{padding:26px 32px 56px;max-width:1240px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}.eb{font-size:10px;font-weight:700;letter-spacing:1.2px;color:var(--acc);display:flex;align-items:center;gap:7px}.eb i{width:7px;height:7px;border-radius:50%;background:var(--acc)}
h1{font:800 28px Manrope,sans-serif;letter-spacing:-.8px;margin:4px 0 2px}.hd p{margin:0;color:var(--mut)}h2{font-size:1rem;margin:0 0 10px;font-weight:700}.cap{color:var(--mut);font-size:.82rem}
.imp{background:var(--acc);color:#fff;padding:9px 16px;border-radius:9px;font-weight:600;cursor:pointer;box-shadow:0 6px 16px rgba(47,143,107,.3)}.imp input{display:none}
.ban{display:flex;gap:8px;align-items:center;font-size:.8rem;color:var(--mut);margin-bottom:14px}.ban i{width:8px;height:8px;border-radius:50%;background:#2fd08b;box-shadow:0 0 0 4px rgba(47,208,139,.2)}
.grid{display:grid;gap:16px;margin-bottom:16px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g21{grid-template-columns:1.6fr 1fr}
.card,#prev:not(:empty){background:var(--card);border:1px solid var(--cardb);border-radius:14px;padding:18px;min-width:0;backdrop-filter:blur(10px);box-shadow:0 8px 28px rgba(20,50,40,.08)}#prev:not(:empty){margin-bottom:16px}
.k .l{color:var(--mut);font-size:.72rem;font-weight:700;letter-spacing:.8px}.k .v{font:700 1.65rem Manrope,sans-serif;letter-spacing:-.5px;margin:2px 0}.pill{display:inline-block;padding:1px 9px;border-radius:10px;font-size:.78rem;font-weight:600;background:rgba(18,132,79,.15)}.pill.dn{background:rgba(207,67,57,.15)}
.up{color:var(--up)}.dn{color:var(--dn)}.am{color:var(--am)}
table{border-collapse:collapse;width:100%;font-size:.86rem}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:600;cursor:pointer;font-size:.78rem}.tw{overflow-x:auto}
input,select{font:inherit;color:var(--ink);background:var(--cardb);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
button.b{font:inherit;background:var(--acc);color:#fff;border:0;border-radius:9px;padding:9px 18px;cursor:pointer;font-weight:600}button.b.s{background:var(--accb);color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible,.srch:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.row>div{flex:1;min-width:120px}label{display:block;font-size:.78rem;color:var(--mut);margin-bottom:3px}
.tag{display:inline-block;font-size:.72rem;padding:2px 9px;border-radius:10px;background:var(--accb);color:var(--acc);font-weight:600}.tag.a{background:var(--amb);color:var(--am)}.tag.g{background:rgba(18,132,79,.15);color:var(--up)}
.bar{display:grid;grid-template-columns:90px 1fr 52px;gap:8px;align-items:center;font-size:.85rem;margin:8px 0}.bar .t{height:11px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px}
.donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.donut svg{width:160px;height:160px}.leg div{font-size:.85rem;display:flex;gap:7px;align-items:center;margin:2px 0}.leg i{width:10px;height:10px;border-radius:3px}
.tog{display:flex;gap:4px}.tog button{border:0;background:var(--accb);color:var(--acc);border-radius:7px;padding:4px 12px;font:inherit;font-weight:600;cursor:pointer}.tog button.on{background:var(--acc);color:#fff}
.chartbox svg{width:100%;height:230px;display:block}.lgd{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--mut);margin-bottom:6px}.lgd i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.mv{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.mv small{color:var(--mut);display:block;font-size:.76rem}
.chat{display:flex;flex-direction:column;height:min(580px,72vh)}.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px}
.m{max-width:86%;padding:11px 15px;border-radius:14px;background:var(--cardb);border:1px solid var(--line)}.m.u{align-self:flex-end;background:var(--acc);color:#fff;border-color:var(--acc)}.m .meta{margin-top:8px;font-size:.75rem;color:var(--mut)}.m a{color:var(--acc);font-weight:600}
.sug button{display:flex;justify-content:space-between;width:100%;text-align:left;border:1px solid var(--line);background:var(--cardb);color:var(--ink);border-radius:10px;padding:11px 13px;font:inherit;cursor:pointer;margin-bottom:8px}.sug button:hover{border-color:var(--acc)}
.res{margin-top:14px;display:grid;gap:4px}.res div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0}
.chk{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.act{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.act span{width:34px;height:34px;border-radius:10px;background:var(--accb);display:grid;place-items:center;flex:none}.act small{color:var(--mut);display:block}
.hide{display:none}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto;padding:10px}.brand,.wl,.bot{display:none}nav{display:flex;overflow-x:auto}nav button{white-space:nowrap;height:36px}.top{padding:10px 14px}.srch{min-width:0}.srch span{display:none}.content{padding:18px 14px 48px}.g4,.g3{grid-template-columns:1fr 1fr}.g2,.g21{grid-template-columns:1fr}}
.chip{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--cardb);border-radius:10px;padding:8px 14px;font-size:.85rem}.chip label{color:var(--acc);font-weight:600;cursor:pointer}.chip input{display:none}
.wel{max-width:640px;margin:36px auto;text-align:center}.wel h1{font-size:34px}.dz{display:block;border:2px dashed var(--acc);border-radius:18px;padding:46px 20px;cursor:pointer;background:var(--accb)}.dz:hover{background:var(--card)}.dz input{display:none}.dz b{font-size:1.15rem}
.ov{position:fixed;inset:0;background:rgba(5,15,10,.5);z-index:30;display:none}.ov.on{display:block}
.dr{position:absolute;top:0;right:0;height:100%;width:min(430px,100%);background:var(--bg);box-shadow:-12px 0 40px rgba(0,0,0,.25);padding:calc(18px + env(safe-area-inset-top,0px)) 20px 20px;overflow:auto}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.dh b{font:800 1.2rem Manrope,sans-serif}
[data-stock],[data-sec],[data-kpi],[data-risk],[data-act]{cursor:pointer}
.card[data-kpi]{transition:transform .15s}.card[data-kpi]:hover{transform:translateY(-3px);border-color:var(--acc)}
tr[data-stock]:hover td,.mv[data-stock]:hover,.bar[data-stock]:hover,.chk[data-risk]:hover,.act[data-act]:hover,.leg div[data-sec]:hover{background:var(--accb)}
.cp{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.cp button{border:1px solid var(--line);background:var(--cardb);color:var(--ink);border-radius:16px;padding:4px 13px;font:inherit;font-size:.82rem;cursor:pointer}.cp button.on,.cp button:hover{background:var(--acc);color:#fff;border-color:var(--acc)}
.tip{position:absolute;top:8px;background:var(--cardb);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:.78rem;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.fact{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.acts{display:grid;gap:8px;margin-top:16px}.acts .b{width:100%}
.ana:hover,.prof:hover{background:rgba(255,255,255,.14)}.prof{border-radius:10px;cursor:pointer}.bc a{color:var(--mut);text-decoration:none}.bc a:hover{color:var(--acc)}
pre{white-space:pre-wrap;font-size:.74rem;background:var(--cardb);padding:10px;border-radius:8px;overflow:auto;max-height:50vh}.stg{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.stg span{padding:5px 12px;border-radius:16px;border:1px solid var(--line);font-size:.8rem;background:var(--cardb)}.stg .d{background:var(--accb);color:var(--acc);border-color:var(--acc)}.stg .c{background:var(--amb);color:var(--am);border-color:var(--am)}.cardx{cursor:pointer}.cardx:hover{border-color:var(--acc)}.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
button:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>
<div class="app">
<aside><div class="brand"><i>Z</i><span>Zerodha <b>AI</b> Intelligence</span></div><div class="wl">WORKSPACE</div><nav id="nav"></nav>
<div class="bot"><div class="ana" id="ana" role="button" tabindex="0" style="cursor:pointer"><span>💡</span><div><b>Krati Shrivastava</b><small>Your analyst</small></div><u></u></div><div class="prof" id="prof" role="button" tabindex="0"><span class="av">KS</span><div><b>Krati Shrivastava</b><small>Retail investor</small></div></div></div></aside>
<section class="ma"><header class="top"><div class="bc"><a href="#" id="bcw">Workspace</a> / <b id="bc"></b></div><div class="ta"><button class="srch" id="srch"><span>🔍 Search holdings</span><kbd>Ctrl K</kbd></button><button class="ib" id="th" aria-label="Toggle theme">◐</button><button class="ib" id="bell" aria-label="Notifications">🔔<i></i></button><span class="av sm">KS</span></div></header>
<div class="ov" id="ov"><div class="dr" role="dialog" aria-modal="true"><div class="dh"><b id="dt"></b><button class="ib" id="dx" aria-label="Close panel">✕</button></div><div id="db"></div></div></div>
<div class="content"><div id="hd"></div><div id="prev"></div><div id="v"></div></div></section>
</div>
<script>
const $=s=>document.querySelector(s),inr=x=>Math.round(x).toLocaleString("en-IN"),rs=x=>(x<0?"-":"")+"₹"+inr(Math.abs(x)),f2=x=>(+x).toFixed(2);
const COL=["--c1","--c2","--c3","--c4","--c5","--c6"];
const Q={HDFCBANK:[1000,.6],RELIANCE:[1430,-.4],TCS:[3220,-.9],INFY:[1660,.3],ICICIBANK:[1400,1.1],ITC:[416,.2],SBIN:[850,.8],LT:[3600,.5],WIPRO:[262,-.2],AXISBANK:[1100,.4],MARUTI:[12400,-.3],SUNPHARMA:[1700,.7]};
const SEC={HDFCBANK:"Banking",RELIANCE:"Energy",TCS:"IT",INFY:"IT",ICICIBANK:"Banking",ITC:"FMCG",SBIN:"Banking",LT:"Infrastructure",WIPRO:"IT",AXISBANK:"Banking",MARUTI:"Auto",SUNPHARMA:"Pharma"};
const SAMPLE=[["HDFCBANK",233,920],["RELIANCE",150,1310],["TCS",55,3480],["INFY",100,1500],["ICICIBANK",93,1180],["ITC",190,390]].map(([s,q,a])=>({s,q,a,sec:SEC[s]}));
let H=[],ready=false,PNAME="";function save(){try{localStorage.setItem('zai',JSON.stringify({H,PNAME,WL}))}catch(e){}}
function quote(s){s=s.toUpperCase();if(Q[s])return Q[s];let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%9973;return[+(100+h%2900),+(((h%40)-20)/10).toFixed(1)]}
let _cc=null,_ch=null;function calc(){if(_cc&&_ch===H)return _cc;_ch=H;return _cc=calcRaw()}
function calcRaw(){const rows=H.map(h=>{const[l,d]=quote(h.s);const inv=h.q*h.a,val=h.q*l;return{...h,ltp:l,d,inv,val,pnl:val-inv,pct:(val-inv)/inv*100,day:val*d/(100+d)}});
 const T=rows.reduce((a,r)=>a+r.val,0);rows.forEach(r=>r.w=r.val/T*100);
 const inv=rows.reduce((a,r)=>a+r.inv,0),day=rows.reduce((a,r)=>a+r.day,0),hhi=rows.reduce((a,r)=>a+(r.w/100)**2,0);
 const sec={};rows.forEach(r=>sec[r.sec]=(sec[r.sec]||0)+r.w);
 const sl=Object.entries(sec).sort((a,b)=>b[1]-a[1]);const s=[...rows].sort((a,b)=>b.w-a.w);
 return{rows,T,inv,pnl:T-inv,pct:(T-inv)/inv*100,day,hhi,sl,top3:s.slice(0,3).reduce((a,r)=>a+r.w,0),s}}
function donut(sl){let o=0,C=2*Math.PI*58,t="";sl.forEach((x,i)=>{const l=C*x[1]/100;t+=`<circle data-sec="${x[0]}" r="58" cx="80" cy="80" fill="none" stroke="var(${COL[i%6]})" stroke-width="26" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}" transform="rotate(-90 80 80)"/>`;o+=l});
 return`<div class="donut"><svg viewBox="0 0 160 160" role="img" aria-label="Sector split">${t}</svg><div class="leg">${sl.map((x,i)=>`<div data-sec="${x[0]}"><i style="background:var(${COL[i%6]})"></i>${x[0]} ${f2(x[1])}%</div>`).join("")}</div></div>`}
const cls=x=>x<0?"dn":"up",sg=x=>(x>0?"+":"")+f2(x);
const hhiLbl=h=>h>=.25?"High":h>=.15?"Moderate":"Broader spread";
let WL=["TCS","SBIN","LT"],budget=25,cache={},sortK="val",sortD=-1,pending=null,lastQ=null;
const SCR={
overview(){const c=calc(),n=per=="1M"?22:66,[A,B]=series(n),mn=Math.min(...A,...B),mx=Math.max(...A,...B),X=i=>i/(n-1)*600,Y=v=>200-(v-mn)/(mx-mn)*180,P=a=>a.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" "),pr=(A[n-1]/A[0]-1)*100,nr=(B[n-1]/B[0]-1)*100;
 const mov=[...c.rows].sort((a,b)=>b.d-a.d);
 window.CH={A,B,n};return`<div class="ban"><i style="background:${STALE?"#e08a00":"#2fd08b"}"></i>Alpha Vantage · ${freshTxt()} <button class="b s" id="rf" style="padding:3px 12px;margin-left:8px">Refresh data</button></div>
<div class="grid g4"><div class="card k" data-kpi="val" title="Click for breakdown"><div class="l">CURRENT VALUE</div><div class="v">${rs(c.T)}</div><span class="pill ${c.pct<0?"dn":"up"}">${c.pct<0?"↘":"↗"} ${sg(c.pct)}%</span> <span class="cap">since purchase</span></div>
<div class="card k" data-kpi="inv" title="Click for breakdown"><div class="l">INVESTED AMOUNT</div><div class="v">${rs(c.inv)}</div><span class="cap">Across ${H.length} holdings</span></div>
<div class="card k" data-kpi="ret" title="Click for breakdown"><div class="l">TOTAL RETURNS</div><div class="v ${cls(c.pnl)}">${c.pnl>0?"+":""}${rs(c.pnl)}</div><span class="${cls(c.pnl)}">${sg(c.pct)}%</span> <span class="cap">absolute return</span></div>
<div class="card k" data-kpi="day" title="Click for breakdown"><div class="l">TODAY’S CHANGE</div><div class="v ${cls(c.day)}">${c.day>0?"+":""}${rs(c.day)}</div><span class="${cls(c.day)}">${sg(c.day/c.T*100)}%</span> <span class="cap">vs previous close</span></div></div>
<div class="grid g21"><div class="card"><div class="row" style="justify-content:space-between;align-items:center"><div><h2 style="margin:0">Portfolio performance</h2><span class="cap">Value over time</span></div><div class="tog">${["1M","3M"].map(x=>`<button data-p="${x}" class="${per==x?"on":""}">${x}</button>`).join("")}</div></div>
<div class="lgd" style="margin-top:10px"><span><i style="background:var(--c1)"></i>Your portfolio ${sg(pr)}%</span><span><i style="background:var(--c3)"></i>NIFTY 50 ${sg(nr)}%</span></div>
<div class="chartbox"><svg viewBox="0 0 600 210" preserveAspectRatio="none" role="img" aria-label="Performance chart"><defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c1)" stop-opacity=".35"/><stop offset="1" stop-color="var(--c1)" stop-opacity="0"/></linearGradient></defs><path d="${P(A)} L600 210 L0 210Z" fill="url(#gf)"/><path d="${P(B)}" fill="none" stroke="var(--c3)" stroke-width="2" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/><path d="${P(A)}" fill="none" stroke="var(--c1)" stroke-width="2.6" vector-effect="non-scaling-stroke"/></svg></div></div>

 openDr(sy,(r?fact("Sector",r.sec)+fact("Quantity",r.q)+fact("Average price","₹"+f2(r.a))+fact("Last price","₹"+f2(l))+fact("Value",rs(r.val))+fact("Unrealized P&L",`<span class="${cls(r.pnl)}">${rs(r.pnl)} (${sg(r.pct)}%)</span>`)+fact("Weight",f2(r.w)+"%")+fact("Today",`<span class="${cls(d)}">${sg(d)}%</span>`):fact("Sector",SEC[sy]||"NSE")+fact("Last price","₹"+f2(l))+fact("Today",`<span class="${cls(d)}">${sg(d)}%</span>`)+'<p class="cap">Not in your portfolio.</p>')+
 `<div class="acts">${r?`<button class="b" data-do="ask" data-arg="${sy}">Ask AI about ${sy}</button>`:""}<button class="b s" data-do="quote" data-arg="${sy}">Get fresh quote</button><button class="b s" data-do="news" data-arg="${sy}">Read news</button><button class="b s" data-do="wl" data-arg="${sy}">${w?"Remove from":"Add to"} watchlist</button></div>`)}
function secDr(x){const c=calc(),a=c.rows.filter(r=>r.sec==x);openDr(x+" holdings",fact("Share of portfolio",f2(a.reduce((t,r)=>t+r.w,0))+"%")+fact("Holdings",a.length)+rowsHtml(a)+`<div class="acts"><button class="b s" data-do="filter" data-arg="${x}">View in Portfolio</button></div>`)}
function kpiDr(k){const c=calc(),T={val:"Current value",inv:"Invested amount",ret:"Total returns",day:"Today’s change"};const a=[...c.rows].sort((p,q)=>q[k=="val"?"val":k=="inv"?"inv":k=="ret"?"pnl":"day"]-p[k=="val"?"val":k=="inv"?"inv":k=="ret"?"pnl":"day"]);
 const v=r=>k=="val"?rs(r.val):k=="inv"?rs(r.inv):k=="ret"?rs(r.pnl):rs(r.day);openDr(T[k],`<p class="cap">Breakdown by holding. Click one for details.</p>`+a.map(r=>`<div class="mv" data-stock="${r.s}"><span><b>${r.s}</b><small>${f2(r.w)}% of portfolio</small></span><b class="${k=="val"||k=="inv"?"":cls(k=="ret"?r.pnl:r.day)}">${v(r)}</b></div>`).join(""))}
function riskDr(i){const c=calc(),vals=[c.hhi.toFixed(3),f2(c.top3)+"%",c.sl[0][0]+" "+f2(c.sl[0][1])+"%"];openDr(["HHI concentration","Top 3 holdings","Largest sector"][i],fact("Your value",vals[i])+fact("Reference",RX[i][1])+`<p>${RX[i][0]}</p><div class="acts"><button class="b" data-do="ask2">Ask the AI Analyst</button></div>`)}
function srcDr(n){openDr("Source ["+n+"]",fact("Outlet",["Business Daily India","Market Wire"][n-1]||"News source")+fact("Retrieved","Today")+'<p>Numbered sources show where each news point came from, so you can open the original article and check the summary yourself.</p>')}
function actDr(i){const a=ACT[i];openDr("Activity",fact("Event",a[0])+fact("Time",a[1])+`<div class="acts"><button class="b" data-do="page" data-arg="${rel(a[0])}">Open related page</button></div>`)}
function openSearch(){if(!ready)return;openDr("Search",'<input id="sq" placeholder="Search holdings or symbols"><div id="sr" style="margin-top:10px"></div>');const f=()=>{const q=$("#sq").value.trim().toUpperCase(),a=[...new Set([...H.map(h=>h.s),...Object.keys(Q)])].filter(x=>x.includes(q)).slice(0,12);$("#sr").innerHTML=a.map(x=>`<div class="mv" data-stock="${x}"><span><b>${x}</b><small>${H.some(h=>h.s==x)?"In your portfolio":SEC[x]||"NSE"}</small></span><span>₹${f2(quote(x)[0])}</span></div>`).join("")||'<p class="cap">No match.</p>'};$("#sq").oninput=f;f();$("#sq").focus()}
function bellDr(){const c=calc();$("#bell i").style.display="none";const n=[["Largest sector: "+c.sl[0][0]+" at "+f2(c.sl[0][1])+"% (limit 45%)","risk"],["Top 3 holdings at "+f2(c.top3)+"% (limit 65%)","risk"],["Best mover today: "+[...c.rows].sort((a,b)=>b.d-a.d)[0].s,"markets"],["Portfolio file saved: "+PNAME,"portfolio"]];
 openDr("Notifications",n.map(x=>`<div class="mv" data-do="page" data-arg="${x[1]}" style="cursor:pointer"><span>${x[0]}</span><span>→</span></div>`).join(""))}
function profDr(){openDr("Krati Shrivastava",fact("Role","Retail investor")+fact("Portfolio",ready?PNAME+" · "+H.length+" holdings":"Not uploaded")+`<div class="acts"><button class="b" data-do="replace">Replace portfolio file</button><button class="b s" data-do="theme">Switch light/dark</button><button class="b s" data-do="reset">Reset workspace</button></div>`)}
function doIt(a,g){if(a=="ask"){closeDr();go("analyst");say("Tell me about my "+g+" holding")}else if(a=="ask2"){closeDr();go("analyst");say("How concentrated is my portfolio?")}
 else if(a=="quote"){closeDr();go("markets");$("#sym").value=g;$("#gq").click()}else if(a=="news"){closeDr();go("news");$("#ns").value=g;$("#gn").click()}
 else if(a=="wl"){WL=WL.includes(g)?WL.filter(x=>x!=g):[...WL,g];save();log("Watchlist updated");stockDr(g)}else if(a=="page"){closeDr();go(g)}
 else if(a=="filter"){secF=g;closeDr();go("portfolio")}else if(a=="replace"){closeDr();const i=$("#csv");if(i)i.click()}
 else if(a=="theme"){$("#th").click()}else if(a=="reset"){try{localStorage.removeItem("zai")}catch(e){}resetAll();closeDr();go("overview")}}
document.addEventListener("click",e=>{const t=e.target.closest("[data-stock],[data-sec],[data-kpi],[data-risk],[data-src],[data-news],[data-quote],[data-act],[data-do],[data-card]");if(!t)return;const d=t.dataset;e.preventDefault();
 if(d.stock)stockDr(d.stock);else if(d.sec)secDr(d.sec);else if(d.kpi)kpiDr(d.kpi);else if(d.risk!==undefined)riskDr(+d.risk);else if(d.src)srcDr(+d.src);
 else if(d.news){go("news");$("#ns").value=d.news;$("#gn").click()}else if(d.quote){go("markets");$("#sym").value=d.quote;$("#gq").click()}else if(d.act!==undefined)actDr(+d.act);else if(d.card)cardDr(d.card);else if(d.do)(doIt2(d.do,d.arg)||doIt(d.do,d.arg))});
document.addEventListener("keydown",e=>{if(e.key=="Escape")closeDr();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=="k"){e.preventDefault();openSearch()}});
$("#ov").onclick=e=>{if(e.target.id=="ov")closeDr()};$("#dx").onclick=closeDr;
$("#bell").onclick=()=>ready?bellDr():0;$("#srch").onclick=openSearch;$("#ana").onclick=()=>go("analyst");$("#prof").onclick=profDr;$("#bcw").onclick=e=>{e.preventDefault();go("overview")};

try{const d=JSON.parse(localStorage.getItem("zai")||"null");if(d&&d.H&&d.H.length){H=d.H.filter(h=>h&&/^[A-Z0-9&-]{1,20}$/.test(h.s)&&h.q>0&&h.a>0).map(h=>({s:h.s,q:+h.q,a:+h.a,sec:clean(h.sec)||"Other"}));PNAME=clean(d.PNAME||"My portfolio")||"My portfolio";WL=(d.WL||WL).filter(x=>/^[A-Z0-9&-]{1,20}$/.test(x));ready=H.length>0}}catch(e){}
go("overview");
</script>
</body>
</html>
